[package]
name = "ephemeris"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first temporal information system"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
dirs = "6.0"
eframe = "0.36.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
